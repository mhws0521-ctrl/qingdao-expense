<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=1366"><title>MY ASSETS | 자산 계보도</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,'Malgun Gothic',sans-serif;background:#f2f5fa;color:#20304a}header{height:66px;background:#15263f;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px}header h1{font-size:20px;margin:0}button{border:0;border-radius:8px;padding:10px 13px;cursor:pointer;background:#2364d2;color:white;font-weight:650}button.alt{background:#e8eef8;color:#24446e}button:disabled{opacity:.5;cursor:wait}input,select{padding:10px;border:1px solid #d5ddeb;border-radius:7px;width:100%;background:#fff}label{display:block;font-size:12px;font-weight:700;margin:10px 0 5px}main{display:grid;grid-template-columns:250px minmax(650px,1fr) 330px;gap:12px;padding:12px;height:calc(100vh - 66px)}aside,article{background:white;border:1px solid #dfe6f1;border-radius:12px;overflow:auto;padding:16px}h2{font-size:16px;margin:4px 0 14px}.muted{color:#77849a;font-size:12px}.item{display:block;text-align:left;background:#f2f6fc;color:#253a5c;width:100%;margin:7px 0;padding:12px}.item:hover{background:#dceafa}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}.stage{height:calc(100% - 85px);overflow:auto;border:1px solid #dbe4f0;border-radius:12px;background-color:#fafcff;background-image:radial-gradient(#dce5f2 1px,transparent 1px);background-size:22px 22px}.stage svg{display:block}.node{cursor:pointer}.node:hover rect{stroke:#2563eb;stroke-width:2.5}.detail{background:#f5f8fd;border-radius:10px;padding:12px;line-height:1.8;white-space:pre-wrap}.row{display:flex;gap:8px}.row>*{flex:1}.hidden{display:none}.error{color:#b42318;font-size:12px}.legend{font-size:12px;color:#64748b;margin-bottom:10px}.chip{border-radius:7px;padding:7px 10px;background:#edf3fb;margin:5px 0}.login{max-width:410px;margin:12vh auto;padding:30px;background:white;border-radius:16px;box-shadow:0 12px 40px #233b5c15}#app{display:none}.years button{display:block;width:100%;text-align:left;margin:5px 0;background:#eaf1fb;color:#1c477b}.years button.active{background:#225ac4;color:white}small{color:#71819a}</style></head><body>
<div id="login" class="login"><h1>MY ASSETS</h1><p class="muted">PC 전용 · 연도별 자산 계보 관리</p><label>사용자</label><select id="person"><option>문호원</option><option>김은경</option></select><label>가족 PIN</label><input id="pin" type="password" inputmode="numeric"><p id="login-error" class="error"></p><button id="login-btn" style="width:100%">로그인</button></div>
<div id="app"><header><h1>MY ASSETS <small> / 연도별 자산 계보도</small></h1><div><span id="who"></span>　<a href="./index.html" style="color:#a8c8ff">기존 자산 화면</a>　<button class="alt" id="logout">로그아웃</button></div></header><main><aside><h2>연도별 자산</h2><div class="years" id="years"></div><hr><div id="asset-list"></div></aside><article><div class="toolbar"><strong>자산 흐름 마인드맵</strong><button id="new" class="alt">＋ 새 자산</button><button id="child" class="alt">↳ 다음 연도 자산 추가</button><button id="join" class="alt">연결선 추가</button><button id="reload" class="alt">새로고침</button></div><div class="legend">파랑: 문호원　초록: 김은경　보라: 공동　|　화살표: 자산 이동　|　노드를 클릭해 선택</div><div id="stage" class="stage"></div></article><aside><h2>자산 상세 / 입력</h2><div id="detail" class="detail">왼쪽 목록이나 마인드맵의 자산을 선택하세요.</div><div id="editor"></div></aside></main></div>
<script>
const API='https://sntedkakwtdfrahlkcgh.supabase.co/functions/v1/', $=id=>document.getElementById(id);
let token=sessionStorage.getItem('fa_pin_token')||'',data={},selected=null,year='all';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('ko-KR')+'원';
async function request(path,body){const r=await fetch(API+path,{method:'POST',headers:{'content-type':'application/json',authorization:token},body:JSON.stringify(body)});const v=await r.json();if(!r.ok||v.error)throw Error(v.error||'요청 실패');return v}
const assets=()=>data.fa_v2_assets||[],owners=()=>data.fa_v2_ownership||[],snaps=()=>data.fa_v2_snapshots||[],moves=()=>data.fa_v2_movements||[];
const own=id=>owners().filter(x=>x.asset_id===id).sort((a,b)=>b.effective_on.localeCompare(a.effective_on))[0]?.owner||'unknown';
const color=id=>({moon:'#dceafe',kim:'#ddf7e8',joint:'#eee2ff'})[own(id)]||'#f1f5f9';
const latest=id=>snaps().filter(x=>x.asset_id===id).sort((a,b)=>b.as_of.localeCompare(a.as_of))[0];
function show(){ $('login').style.display='none';$('app').style.display='block';$('who').textContent=sessionStorage.getItem('fa_person')||'가족'}
async function load(){const r=await request('family-lineage-api',{action:'load'});data=r.data;render()}
function render(){const all=assets(),yrs=new Set([2025,2026,new Date().getFullYear()]);snaps().forEach(s=>yrs.add(Number(s.as_of.slice(0,4))));owners().forEach(s=>yrs.add(Number(s.effective_on.slice(0,4))));$('years').innerHTML='<button data-year="all" class="'+(year==='all'?'active':'')+'">전체 연도</button>'+[...yrs].sort().map(y=>'<button data-year="'+y+'" class="'+(year===String(y)?'active':'')+'">'+y+'년</button>').join('');$('years').querySelectorAll('button').forEach(b=>b.onclick=()=>{year=b.dataset.year;render()});const visible=year==='all'?all:all.filter(a=>snaps().some(s=>s.asset_id===a.id&&s.as_of.startsWith(year))||owners().some(o=>o.asset_id===a.id&&o.effective_on.startsWith(year)));$('asset-list').innerHTML=visible.map(a=>'<button class="item" data-asset="'+esc(a.id)+'">'+esc(a.institution)+' · '+esc(a.product_name)+'<br><small>'+esc(latest(a.id)?.as_of||'평가 미입력')+' · '+fmt(latest(a.id)?.market_value)+'</small></button>').join('');$('asset-list').querySelectorAll('[data-asset]').forEach(b=>b.onclick=()=>pick(b.dataset.asset));draw(visible);if(selected)detail(selected)}
function draw(list){if(!list.length){$('stage').innerHTML='<p style="padding:35px">등록된 자산이 없습니다. 「새 자산」을 눌러 입력하세요.</p>';return}const ids=new Set(list.map(a=>a.id)),links=moves().filter(m=>ids.has(m.from_asset_id)&&ids.has(m.to_asset_id));const depth={},busy=new Set();function level(id){if(depth[id]!==undefined)return depth[id];if(busy.has(id))return 0;busy.add(id);const prev=links.filter(m=>m.to_asset_id===id);const v=prev.length?Math.min(10,1+Math.max(...prev.map(m=>level(m.from_asset_id)))):0;busy.delete(id);return depth[id]=v}list.forEach(a=>level(a.id));const cols={};list.forEach(a=>(cols[depth[a.id]]??=[]).push(a));const pos={};let rows=1;Object.entries(cols).forEach(([d,arr])=>{rows=Math.max(rows,arr.length);arr.forEach((a,i)=>pos[a.id]={x:35+Number(d)*265,y:40+i*126})});const width=Math.max(900,300+Math.max(...Object.keys(cols).map(Number))*265),height=Math.max(550,rows*126+70);let s='<svg width="'+width+'" height="'+height+'" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8294af"/></marker></defs>';links.forEach(m=>{const a=pos[m.from_asset_id],b=pos[m.to_asset_id];if(!a||!b)return;const x=a.x+205,y=a.y+36,X=b.x,Y=b.y+36;s+='<path d="M'+x+' '+y+' C'+(x+55)+' '+y+' '+(X-55)+' '+Y+' '+X+' '+Y+'" fill="none" stroke="#8294af" stroke-width="2" marker-end="url(#arrow)"/><text x="'+((x+X)/2)+'" y="'+((y+Y)/2-9)+'" font-size="11" text-anchor="middle" fill="#536781">'+fmt(m.amount)+'</text>'});list.forEach(a=>{const p=pos[a.id],v=latest(a.id);s+='<g class="node" data-id="'+esc(a.id)+'"><rect x="'+p.x+'" y="'+p.y+'" width="205" height="78" rx="12" fill="'+color(a.id)+'" stroke="'+(selected===a.id?'#2364d2':'#a8b8cf')+'"/><text x="'+(p.x+12)+'" y="'+(p.y+21)+'" font-size="11" fill="#48607e">'+esc(a.institution)+'</text><text x="'+(p.x+12)+'" y="'+(p.y+43)+'" font-size="13" font-weight="700" fill="#172b47">'+esc(a.product_name.slice(0,17))+'</text><text x="'+(p.x+12)+'" y="'+(p.y+63)+'" font-size="12" fill="#263e5e">'+esc(v?fmt(v.market_value):'평가액 미입력')+'</text></g>'});$('stage').innerHTML=s+'</svg>';$('stage').querySelectorAll('.node').forEach(n=>n.onclick=()=>pick(n.dataset.id))}
function pick(id){selected=id;render()}
function detail(id){const a=assets().find(x=>x.id===id);if(!a)return;const o=owners().filter(x=>x.asset_id===id).sort((a,b)=>a.effective_on.localeCompare(b.effective_on));const v=snaps().filter(x=>x.asset_id===id).sort((a,b)=>a.as_of.localeCompare(b.as_of));$('detail').textContent=a.institution+' / '+a.product_name+'\n코드: '+a.asset_code+'\n소유권: '+(o.map(x=>x.effective_on+' '+({moon:'문호원',kim:'김은경',joint:'공동'}[x.owner])).join(' → ')||'미등록')+'\n연도별 평가액:\n'+(v.map(x=>x.as_of+'  '+fmt(x.market_value)).join('\n')||'미등록')+'\n연결: '+moves().filter(x=>x.from_asset_id===id||x.to_asset_id===id).length+'건';$('editor').innerHTML='<p><button id="child-here">이 자산에서 다음 연도 자산 추가</button> <button class="alt" id="value-here">올해 평가액 입력</button></p>';$('child-here').onclick=()=>formAsset(id);$('value-here').onclick=()=>formValue(id)}
const input=(name,label,type='text',value='')=>'<label>'+label+'</label><input name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+(type==='number'?'min="0" step="any"':'')+' required>';
const select=(name,label,options)=>'<label>'+label+'</label><select name="'+name+'">'+options.map(([v,t])=>'<option value="'+esc(v)+'">'+esc(t)+'</option>').join('')+'</select>';
const assetSelect=(name,label)=>select(name,label,[['','선택'],...assets().map(a=>[a.id,a.institution+' · '+a.product_name])]);
function form(title,fields,save){$('editor').innerHTML='<hr><h2>'+title+'</h2><form id="entry">'+fields+'<p id="form-error" class="error"></p><button type="submit">저장</button> <button type="button" class="alt" id="cancel">취소</button></form>';$('cancel').onclick=()=>{$('editor').innerHTML=''};$('entry').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('[type=submit]'),v=Object.fromEntries(new FormData(e.target));btn.disabled=true;try{await save(v);$('editor').innerHTML='';await load()}catch(err){$('form-error').textContent=err.message}finally{btn.disabled=false}}}
const create=(table,row)=>request('family-lineage-api',{action:'create',table,row});
function formAsset(parent=null){const y=parent?Math.max(2026,Number(latest(parent)?.as_of.slice(0,4)||2025)+1):2025;form(parent?'다음 연도 자산 추가':'새 자산 등록',input('year','입력 연도','number',y)+input('institution','금융기관')+input('product_name','상품명')+select('category','자산 분류',[['DEPOSIT','예금'],['STOCK','주식·ETF'],['REAL_ESTATE','부동산'],['CASH','현금'],['GOLD','금'],['OTHER','기타'],['DEBT','부채']])+select('owner','소유자',[['moon','문호원'],['kim','김은경'],['joint','공동']])+input('principal','원금 (원)','number','0')+input('market_value','평가액 (원)','number','0')+(parent?input('transfer','전년도 자산에서 이동한 금액 (원)','number','0'):''),async v=>{const date=v.year+'-12-31',asset=await create('fa_v2_assets',{asset_code:'AS-'+crypto.randomUUID(),category:v.category,institution:v.institution,product_name:v.product_name,status:'ACTIVE'});const id=asset.data.id;await create('fa_v2_ownership',{asset_id:id,effective_on:date,owner:v.owner,moon_share:v.owner==='moon'?1:v.owner==='joint'?.5:0,kim_share:v.owner==='kim'?1:v.owner==='joint'?.5:0});await create('fa_v2_snapshots',{asset_id:id,as_of:date,principal:Number(v.principal),market_value:Number(v.market_value),source:'MANUAL'});if(parent&&Number(v.transfer)>0)await create('fa_v2_movements',{from_asset_id:parent,to_asset_id:id,event_on:date,kind:'SPLIT',amount:Number(v.transfer),note:'연도별 자산 계보 연결'});selected=id})}
function formValue(id){form('연도별 자산 평가액 입력',input('year','입력 연도','number',new Date().getFullYear())+input('principal','원금 (원)','number','0')+input('market_value','평가액 (원)','number','0'),async v=>{await create('fa_v2_snapshots',{asset_id:id,as_of:v.year+'-12-31',principal:Number(v.principal),market_value:Number(v.market_value),source:'MANUAL'})})}
$('new').onclick=()=>formAsset();$('child').onclick=()=>selected?formAsset(selected):alert('먼저 자산을 선택하세요');$('join').onclick=()=>form('자산 연결선 추가',assetSelect('from','출처 자산')+assetSelect('to','목적지 자산')+input('year','이동 연도','number',2026)+input('amount','이동 금액 (원)','number','0')+select('kind','연결 유형',[['TRANSFER','이체'],['SPLIT','분할'],['MERGE','합병'],['REINVEST','재예치'],['GIFT','증여']]),async v=>{if(!v.from||!v.to||v.from===v.to)throw Error('서로 다른 두 자산을 선택하세요');await create('fa_v2_movements',{from_asset_id:v.from,to_asset_id:v.to,event_on:v.year+'-12-31',kind:v.kind,amount:Number(v.amount)})});$('reload').onclick=()=>load().catch(e=>alert(e.message));
$('login-btn').onclick=async()=>{try{const v=await request('family-pin-api',{op:'login',person:$('person').value,pin:$('pin').value});token=v.token;sessionStorage.setItem('fa_pin_token',token);sessionStorage.setItem('fa_person',v.person);show();await load()}catch(e){$('login-error').textContent=e.message}};$('pin').onkeydown=e=>{if(e.key==='Enter')$('login-btn').click()};$('logout').onclick=()=>{sessionStorage.removeItem('fa_pin_token');sessionStorage.removeItem('fa_person');location.reload()};if(token){show();load().catch(()=>{sessionStorage.removeItem('fa_pin_token');location.reload()})}
</script></body></html>
