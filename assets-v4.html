<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=1366"><title>MY ASSETS V4 | PC 자산 관리</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,'Malgun Gothic',sans-serif;background:#f2f5fa;color:#20304a}header{height:66px;background:#15263f;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px}header h1{font-size:20px;margin:0}button{border:0;border-radius:8px;padding:10px 13px;cursor:pointer;background:#2364d2;color:white;font-weight:650}button.alt{background:#e8eef8;color:#24446e}button:disabled{opacity:.5;cursor:wait}input,select{padding:10px;border:1px solid #d5ddeb;border-radius:7px;width:100%;background:#fff}label{display:block;font-size:12px;font-weight:700;margin:10px 0 5px}main{display:grid;grid-template-columns:250px minmax(650px,1fr) 330px;gap:12px;padding:12px;height:calc(100vh - 66px)}aside,article{background:white;border:1px solid #dfe6f1;border-radius:12px;overflow:auto;padding:16px}h2{font-size:16px;margin:4px 0 14px}.muted{color:#77849a;font-size:12px}.item{display:block;text-align:left;background:#f2f6fc;color:#253a5c;width:100%;margin:7px 0;padding:12px}.item:hover{background:#dceafa}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}.stage{height:calc(100% - 85px);overflow:auto;border:1px solid #dbe4f0;border-radius:12px;background-color:#fafcff;background-image:radial-gradient(#dce5f2 1px,transparent 1px);background-size:22px 22px}.stage svg{display:block}.node{cursor:pointer}.node:hover rect{stroke:#2563eb;stroke-width:2.5}.detail{background:#f5f8fd;border-radius:10px;padding:12px;line-height:1.8;white-space:pre-wrap}.row{display:flex;gap:8px}.row>*{flex:1}.hidden{display:none}.error{color:#b42318;font-size:12px}.legend{font-size:12px;color:#64748b;margin-bottom:10px}.chip{border-radius:7px;padding:7px 10px;background:#edf3fb;margin:5px 0}.login{max-width:410px;margin:12vh auto;padding:30px;background:white;border-radius:16px;box-shadow:0 12px 40px #233b5c15}#app{display:none}.years button{display:block;width:100%;text-align:left;margin:5px 0;background:#eaf1fb;color:#1c477b}.years button.active{background:#225ac4;color:white}small{color:#71819a}</style></head><body>
<div id="login" class="login"><h1>MY ASSETS</h1><p class="muted">PC 전용 · 연도별 자산 계보 관리</p><label>사용자</label><select id="person"><option>문호원</option><option>김은경</option></select><label>가족 PIN</label><input id="pin" type="password" inputmode="numeric"><p id="login-error" class="error"></p><button id="login-btn" style="width:100%">로그인</button></div>
<div id="app"><header><h1>MY ASSETS V4 <small> / 2025 기준 자산 온톨로지</small></h1><div><span id="who"></span>　<a href="./index.html" style="color:#a8c8ff">기존 자산 화면</a>　<button class="alt" id="logout">로그아웃</button></div></header><main><aside><h2>연도별 자산</h2><div class="years" id="years"></div><hr><div id="asset-list"></div></aside><article><div class="toolbar"><button id="view-table" class="alt">자산 대장</button><button id="view-graph" class="alt">계보도</button><button id="view-stats" class="alt">분석</button><strong>자산 흐름</strong><button id="new" class="alt">＋ 새 자산</button><button id="bulk" class="alt">다중 자산 JSON 등록</button><button id="child" class="alt">↳ 다음 연도 자산 추가</button><button id="join" class="alt">연결선 추가</button><button id="reload" class="alt">새로고침</button><button id="export" class="alt">JSON 백업</button><button id="external" class="alt">외부 자금</button><button id="event" class="alt">연중 거래</button><button id="reconcile" class="alt">연결 검증</button><button id="close-year" class="alt">연도 마감</button></div><div style="padding:9px;background:#fff2d9;border-radius:8px;margin-bottom:9px;color:#8a5100">시험용 프로토타입: 기존 PIN 인증을 사용합니다. 실제 금융정보는 보안 전환 후 입력하세요.</div><div class="legend">파랑: 문호원　초록: 김은경　보라: 공동　|　화살표: 자산 이동　|　노드를 클릭해 선택</div><div id="stage" class="stage"></div><div id="table-view" class="hidden"></div><div id="stats-view" class="hidden"></div></article><aside><h2>자산 상세 / 입력</h2><div id="detail" class="detail">왼쪽 목록이나 마인드맵의 자산을 선택하세요.</div><div id="editor"></div></aside></main></div>
<script>
const API='https://sntedkakwtdfrahlkcgh.supabase.co/functions/v1/', $=id=>document.getElementById(id);
let token=sessionStorage.getItem('fa_pin_token')||'',data={},selected=null,year='2025',view='table';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toLocaleString('ko-KR')+'원';
const types={DEPOSIT:'예금·적금',STOCK:'주식·ETF',GOLD:'금',CRYPTO:'코인',REAL_ESTATE:'부동산',CASH:'현금·외화',DEBT:'부채',LEASE_DEPOSIT:'전세보증금',PENSION:'연금',INSURANCE:'보험',OTHER:'기타'};
const ownerName={moon:'문호원',kim:'김은경'};
const A=()=>data.annual||[],B=()=>data.assets||[],O=()=>data.owners||[],F=()=>data.flows||[];
const asset=id=>B().find(x=>x.id===id), node=id=>A().find(x=>x.id===id), own=id=>O().filter(x=>x.annual_asset_id===id);
const color=id=>{const o=own(id);return o.length===2?'#eee2ff':o[0]?.owner==='moon'?'#dceafe':o[0]?.owner==='kim'?'#ddf7e8':'#f1f5f9'};
async function req(path,body){const r=await fetch(API+path,{method:'POST',headers:{'content-type':'application/json',authorization:token},body:JSON.stringify(body)});const v=await r.json();if(!r.ok||v.error)throw Error(v.error||'요청 실패');return v}
const create=(entity,row)=>req('family-v4-api',{action:'create',entity,row});
function show(){$('login').style.display='none';$('app').style.display='block';$('who').textContent=sessionStorage.getItem('fa_person')||''}
async function load(){data=(await req('family-v4-api',{action:'load'})).data;render()}
function choose(id){selected=id;render()}
function filtered(){return A().filter(a=>!a.deleted_at&&(year==='all'||String(a.year)===year))}
function render(){const ys=[...new Set([2025,2026,new Date().getFullYear(),...A().map(x=>x.year)])].sort();$('years').innerHTML='<button data-y="all" class="'+(year==='all'?'active':'')+'">전체 연도</button>'+ys.map(y=>'<button data-y="'+y+'" class="'+(year===String(y)?'active':'')+'">'+y+'년'+(y===2025?' · 기준':'')+'</button>').join('');$('years').querySelectorAll('button').forEach(b=>b.onclick=()=>{year=b.dataset.y;render()});const list=filtered();$('asset-list').innerHTML=list.map(a=>'<button class="item" data-id="'+a.id+'">'+esc(a.display_name)+'<br><small>'+esc(types[asset(a.asset_id)?.type_code]||'')+' · '+money(a.value_krw)+' · '+a.status+'</small></button>').join('');$('asset-list').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>choose(b.dataset.id));$('stage').classList.toggle('hidden',view!=='graph');$('table-view').classList.toggle('hidden',view!=='table');$('stats-view').classList.toggle('hidden',view!=='stats');if(view==='graph')graph();if(view==='table')table();if(view==='stats')stats();detail()}
function table(){const list=filtered().sort((a,b)=>a.year-b.year||a.display_name.localeCompare(b.display_name));$('table-view').innerHTML='<div style="overflow:auto"><table style="width:100%;border-collapse:collapse"><thead><tr><th>연도</th><th>자산명</th><th>분류</th><th>소유자</th><th>평가액</th><th>상태</th></tr></thead><tbody>'+list.map(a=>'<tr data-id="'+a.id+'" style="cursor:pointer;border-bottom:1px solid #e2e8f0;background:'+(selected===a.id?'#eff6ff':'white')+'"><td style="padding:12px">'+a.year+'</td><td>'+esc(a.display_name)+'</td><td>'+esc(types[asset(a.asset_id)?.type_code]||'')+'</td><td>'+own(a.id).map(o=>ownerName[o.owner]+' '+o.share_bps/100+'%').join(', ')+'</td><td style="text-align:right">'+money(a.value_krw)+'</td><td>'+a.status+'</td></tr>').join('')+'</tbody></table></div>';$('table-view').querySelectorAll('tr[data-id]').forEach(t=>t.onclick=()=>choose(t.dataset.id))}
function graph(){const list=filtered().sort((a,b)=>a.year-b.year),ys=[...new Set(list.map(a=>a.year))].sort(),pos={},col={};ys.forEach((y,i)=>{col[y]=i;list.filter(a=>a.year===y).forEach((a,j)=>pos[a.id]={x:35+i*270,y:60+j*115})});const height=Math.max(550,Math.max(1,...ys.map(y=>list.filter(a=>a.year===y).length))*115+100),width=Math.max(850,ys.length*270+90);let svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+width+'" height="'+height+'"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#7189a8"/></marker></defs>';ys.forEach(y=>svg+='<text x="'+(35+col[y]*270)+'" y="32" font-size="16" font-weight="bold" fill="#334155">'+y+(y===2025?' · BASELINE':'')+'</text>');F().forEach(f=>{const s=pos[f.source_annual_asset_id],t=pos[f.target_annual_asset_id];if(!s||!t)return;svg+='<path d="M'+(s.x+210)+' '+(s.y+34)+' C'+(s.x+245)+' '+(s.y+34)+' '+(t.x-35)+' '+(t.y+34)+' '+t.x+' '+(t.y+34)+'" fill="none" stroke="#8294af" stroke-width="2" marker-end="url(#arr)"/><text x="'+((s.x+t.x+210)/2)+'" y="'+((s.y+t.y)/2+20)+'" font-size="10" fill="#64748b">'+money(f.amount_krw)+'</text>'});list.forEach(a=>{const p=pos[a.id];svg+='<g class="node" data-id="'+a.id+'"><rect x="'+p.x+'" y="'+p.y+'" width="210" height="75" rx="12" fill="'+color(a.id)+'" stroke="'+(a.id===selected?'#1d4ed8':'#b6c5d9')+'"/><text x="'+(p.x+12)+'" y="'+(p.y+21)+'" font-size="12">'+esc(a.display_name.slice(0,17))+'</text><text x="'+(p.x+12)+'" y="'+(p.y+43)+'" font-size="14" font-weight="bold">'+money(a.value_krw)+'</text><text x="'+(p.x+12)+'" y="'+(p.y+62)+'" font-size="10">'+esc(types[asset(a.asset_id)?.type_code]||'')+'</text></g>'});$('stage').innerHTML=svg+'</svg>';$('stage').querySelectorAll('.node').forEach(n=>n.onclick=()=>choose(n.dataset.id))}
function stats(){const list=filtered().filter(a=>a.status==='CONFIRMED'),byYear={};list.forEach(a=>{const d=byYear[a.year]??={assets:0,debts:0};const isDebt=asset(a.asset_id)?.side==='LIABILITY';d[isDebt?'debts':'assets']+=Number(a.value_krw)});$('stats-view').innerHTML='<h2>연도별 확정 순자산</h2>'+Object.entries(byYear).sort().map(([y,v])=>'<div class="chip"><strong>'+y+'년</strong>　총자산 '+money(v.assets)+'　부채 '+money(v.debts)+'　<strong>순자산 '+money(v.assets-v.debts)+'</strong></div>').join('')+'<p class="muted">초안(DRAFT)은 집계에서 제외됩니다.</p>'}
function detail(){const a=node(selected);if(!a){$('detail').textContent='2025년 자산부터 등록하세요.';return}const b=asset(a.asset_id);$('detail').textContent=a.year+'년 · '+a.display_name+'\n'+(types[b?.type_code]||'')+' / '+(b?.institution||'')+'\n원금: '+money(a.principal_native)+'\n평가액: '+money(a.value_krw)+'\n소유: '+own(a.id).map(o=>ownerName[o.owner]+' '+o.share_bps/100+'%').join(', ')+'\n상태: '+a.status+'\n속성: '+JSON.stringify(a.attributes||{});$('editor').innerHTML='<p><button id="child-here">다음 연도 자산 추가</button> <button id="edit-here" class="alt">초안 수정</button> <button id="confirm-here" class="alt">초안 확정</button></p>';$('child-here').onclick=()=>formAsset(a);$('edit-here').onclick=()=>editAsset(a);$('confirm-here').onclick=async()=>{if(!confirm('확정 후 금액 변경이 제한됩니다. 확정하시겠습니까?'))return;try{await req('family-v4-api',{action:'confirm',id:a.id});await load()}catch(e){alert(e.message)}}}
const inp=(n,l,t='text',v='')=>'<label>'+l+'</label><input name="'+n+'" type="'+t+'" value="'+esc(v)+'" '+(t==='number'?'step="any" min="0"':'')+' required>';
const sel=(n,l,arr)=>'<label>'+l+'</label><select name="'+n+'">'+arr.map(([v,t])=>'<option value="'+esc(v)+'">'+esc(t)+'</option>').join('')+'</select>';
const nsel=(n,l,filter=()=>true)=>sel(n,l,[['','선택'],...A().filter(filter).map(a=>[a.id,a.year+' '+a.display_name])]);
function form(title,body,fn){$('editor').innerHTML='<hr><h2>'+title+'</h2><form id="entry">'+body+'<p class="error" id="form-error"></p><button type="submit">저장</button> <button type="button" class="alt" id="cancel">취소</button></form>';$('cancel').onclick=()=>{$('editor').innerHTML=''};$('entry').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('[type=submit]');btn.disabled=true;try{await fn(Object.fromEntries(new FormData(e.target)));$('editor').innerHTML='';await load()}catch(err){$('form-error').textContent=err.message}finally{btn.disabled=false}}}
function formAsset(parent=null){
const yr0=parent?parent.year+1:year==='all'?2025:Number(year);
form(parent?'다음 연도 자산 등록':'신규 자산 등록',inp('year','연도','number',yr0)+inp('institution','기관')+inp('name','자산명')+sel('type','유형',Object.entries(types))+sel('side','구분',[['ASSET','자산'],['LIABILITY','부채']])+sel('owner','소유자',[['moon','문호원'],['kim','김은경'],['joint','공동']])+inp('moon_share','문호원 지분율 (%)','number',50)+inp('principal','원금','number',0)+inp('value','원통화 평가액','number',0)+inp('currency','통화','text','KRW')+inp('fx','환율','number',1)+inp('attributes','추가 정보 JSON','text','{}')+(parent?inp('moved','이동액 (원)','number',0)+sel('continuation','계보',[['new','다른 자산으로 이동'],['carry','동일 자산 계속 보유']]):''),async v=>{
const yr=Number(v.year),value=Number(v.value),principal=Number(v.principal),fx=Number(v.fx);
if(!Number.isInteger(yr)||yr<2025||value<0||principal<0||fx<=0)throw Error('연도·금액 오류');
if(parent&&yr!==parent.year+1)throw Error('인접 연도만 연결');
if(v.currency.toUpperCase()==='KRW'&&fx!==1)throw Error('원화 환율은 1');
let attrs;try{attrs=JSON.parse(v.attributes)}catch{throw Error('JSON 오류')}
const carry=!!parent&&v.continuation==='carry',old=parent?asset(parent.asset_id):null;
if(carry&&(old?.type_code!==v.type||old?.side!==v.side))throw Error('계속 보유는 같은 유형과 방향이어야 합니다');
const assetId=carry?parent.asset_id:crypto.randomUUID(),annualId=crypto.randomUUID();
const shares=v.owner==='joint'?[['moon',Math.round(Number(v.moon_share)*100)],['kim',10000-Math.round(Number(v.moon_share)*100)]]:[[v.owner,10000]];
if(shares.some(x=>x[1]<=0||x[1]>10000))throw Error('지분율 오류');
const payload={assets:carry?[]:[{id:assetId,type_code:v.type,side:v.side,aggregation_role:'LEAF',institution:v.institution,display_name:v.name,attributes:attrs}],annual_assets:[{id:annualId,asset_id:assetId,year:yr,display_name:v.name,attributes:attrs,principal_native:principal,value_native:value,currency:v.currency.toUpperCase(),fx_rate:fx,valuation_on:yr+'-12-31'}],ownership:shares.map(([owner,share_bps])=>({annual_asset_id:annualId,owner,share_bps})),flows:parent?[{source_annual_asset_id:parent.id,target_annual_asset_id:annualId,flow_kind:carry?'CARRY':'TRANSFER',amount_semantics:carry?'CARRIED_VALUE':'MOVED_CASH',source_amount:Number(v.moved),target_amount:Number(v.moved),amount_krw:Number(v.moved),event_on:yr+'-12-31'}]:[]};
await req('family-v4-api',{action:'register_bundle',request_id:crypto.randomUUID(),payload});selected=annualId;year=String(yr);
});
if(parent){const e=$('entry');e.querySelector('[name=type]').value=asset(parent.asset_id)?.type_code||'DEPOSIT';e.querySelector('[name=side]').value=asset(parent.asset_id)?.side||'ASSET';e.querySelector('[name=name]').value=parent.display_name;}
}
function editAsset(a){if(a.status==='CONFIRMED'){form('확정 자산 정정',inp('name','자산명','text',a.display_name)+inp('value','평가액 (원통화)','number',a.value_native)+inp('reason','정정 사유 (5자 이상)'),async v=>{await req('family-v4-api',{action:'correct_annual',id:a.id,version:a.version,patch:{display_name:v.name,value_native:Number(v.value)},reason:v.reason});});return;}form('자산 초안 수정',inp('name','자산명','text',a.display_name)+inp('principal','원금','number',a.principal_native)+inp('value','평가액','number',a.value_krw),async v=>{await req('family-v4-api',{action:'update',entity:'annual',id:a.id,version:a.version,row:{display_name:v.name,principal_native:Number(v.principal),value_native:Number(v.value),value_krw:Number(v.value)}})})}
function link(){form('자산 계보 연결 (합병 지원)',nsel('from','출처 자산')+nsel('to','대상 자산')+inp('amount','이동액 (원)','number',0),async v=>{const s=node(v.from),t=node(v.to);if(!s||!t||t.year!==s.year+1)throw Error('연속된 두 연도 자산만 연결할 수 있습니다');await create('flows',{source_annual_asset_id:s.id,target_annual_asset_id:t.id,flow_kind:'TRANSFER',amount_semantics:'MOVED_CASH',source_amount:Number(v.amount),target_amount:Number(v.amount),amount_krw:Number(v.amount),event_on:t.year+'-12-31'})})}
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({exported_at:new Date().toISOString(),schema:'fa_v4',data},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='MY_ASSETS_V4_BACKUP_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)};
$('external').onclick=()=>form('외부 자금 유입·유출',sel('direction','구분',[['IN','외부 유입'],['OUT','외부 유출']])+sel('category','종류',[['SALARY','급여'],['GIFT','증여'],['INHERITANCE','상속'],['EXPENSE','생활비'],['TAX','세금'],['OTHER','기타']])+inp('label','설명')+nsel('annual','연결 자산')+inp('amount','원화 금액','number',0),async v=>{const n=node(v.annual);if(!n)throw Error('연결 자산을 선택하세요');const ext=(await create('external',{direction:v.direction,category:v.category,display_name:v.label})).data;const row={flow_kind:v.direction==='IN'?'NEW_MONEY':'WITHDRAWAL',amount_semantics:'MOVED_CASH',source_amount:Number(v.amount),target_amount:Number(v.amount),amount_krw:Number(v.amount),event_on:n.year+'-12-31'};if(v.direction==='IN'){row.source_external_id=ext.id;row.target_annual_asset_id=n.id}else{row.source_annual_asset_id=n.id;row.target_external_id=ext.id}await create('flows',row)});
$('event').onclick=()=>form('연중 거래 이벤트',sel('asset','자산',B().map(b=>[b.id,b.display_name]))+inp('date','거래일','date',new Date().toISOString().slice(0,10))+sel('kind','종류',[['BUY','매수'],['SELL','매도'],['STOCK_SPLIT','액면분할'],['DIVIDEND','배당'],['INTEREST','이자'],['TRANSFER','이동']])+inp('gross','거래액','number',0)+inp('fees','수수료','number',0)+inp('taxes','세금','number',0)+inp('gain','실현손익','number',0),async v=>{await create('events',{asset_id:v.asset,event_on:v.date,event_kind:v.kind,gross:Number(v.gross),fees:Number(v.fees),taxes:Number(v.taxes),realized_gain:Number(v.gain)})});

$('reconcile').onclick=async()=>{try{const yr=year==='all'?2025:Number(year);const r=await req('family-v4-api',{action:'year_issues',year:yr});const issues=r.data.issues;$('editor').innerHTML='<h2>'+yr+'년 계보 대조</h2><p>검토 자산 '+r.data.checked+'개 · 점검사항 '+issues.length+'건</p>'+issues.map(i=>'<div class="chip">'+esc(i.name)+' : '+esc(i.code)+' · '+esc(i.severity)+'</div>').join('')+'<p class="muted">평가액과 이동액의 시점 차이는 오류가 아닌 검토사항입니다.</p>'}catch(e){alert(e.message)}};
$('close-year').onclick=async()=>{const yr=year==='all'?2025:Number(year);if(!confirm(yr+'년 자산을 마감하면 해당 연도 수정이 차단됩니다. 진행할까요?'))return;try{await req('family-v4-api',{action:'close_year',year:yr});alert(yr+'년 마감 완료');await load()}catch(e){alert(e.message)}};
$('bulk').onclick=()=>{const raw=prompt('V4 일괄 등록 JSON');if(!raw)return;try{const payload=JSON.parse(raw);req('family-v4-api',{action:'register_bundle',request_id:crypto.randomUUID(),payload}).then(()=>load()).catch(e=>alert(e.message))}catch(e){alert(e.message)}};$('new').onclick=()=>formAsset();$('child').onclick=()=>selected?formAsset(node(selected)):alert('출처 자산을 선택하세요');$('join').onclick=link;$('reload').onclick=()=>load().catch(e=>alert(e.message));$('view-table').onclick=()=>{view='table';render()};$('view-graph').onclick=()=>{view='graph';year='all';render()};$('view-stats').onclick=()=>{view='stats';render()};
$('login-btn').onclick=async()=>{try{const v=await req('family-pin-api',{op:'login',person:$('person').value,pin:$('pin').value});token=v.token;sessionStorage.setItem('fa_pin_token',token);sessionStorage.setItem('fa_person',v.person);show();await load()}catch(e){$('login-error').textContent=e.message}};$('pin').onkeydown=e=>{if(e.key==='Enter')$('login-btn').click()};$('logout').onclick=()=>{sessionStorage.removeItem('fa_pin_token');sessionStorage.removeItem('fa_person');location.reload()};if(token){show();load().catch(()=>{sessionStorage.removeItem('fa_pin_token');location.reload()})}
</script></body></html>
